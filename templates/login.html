<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LikeMe ✨ Join the Magic</title>
    
    <!-- PWA Settings: Mobile Home Screen par full screen install karne ke liye -->
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#E9D5FF">
    
    <!-- Google Fonts Pipeline: Chunky bubble text styles load karne ke liye -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Fredoka:wght@600;700&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --pastel-pink: #FFD6E8;
            --pastel-purple: #E8D7FF;
            --pastel-blue: #D6EFFF;
            --fairy-dark: #4A3E56;
        }

        /* MEMORABLE FLUID BACKGROUND SKY */
        body { 
            font-family: 'Quicksand', sans-serif; 
            background: linear-gradient(135deg, var(--pastel-pink), var(--pastel-purple), var(--pastel-blue), #FFE4E6); 
            background-size: 400% 400%;
            animation: fluidGradient 12s ease infinite;
            height: 100vh; display: flex; justify-content: center; align-items: center; margin: 0; overflow: hidden; position: relative;
        }
        @keyframes fluidGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* THE GIANT CINEMATIC FULL MOON */
        .cinema-moon {
            position: absolute; top: 8%; right: 8%; width: 140px; height: 140px;
            background: #FFFDE7; border-radius: 50%;
            box-shadow: 0 0 40px rgba(254, 240, 138, 0.6), inset -10px -10px 20px rgba(0,0,0,0.05);
            z-index: 1; animation: moonPulse 4s ease-in-out infinite alternate;
        }
        @keyframes moonPulse {
            0% { transform: scale(1); box-shadow: 0 0 30px rgba(254, 240, 138, 0.5); }
            100% { transform: scale(1.03); box-shadow: 0 0 50px rgba(244, 114, 182, 0.4); }
        }
        /* E.T. BICYCLE FLIGHT TRAJECTORY SYSTEM */
        .et-flight-system {
            position: absolute; z-index: 2; pointer-events: none;
            animation: etFlyAcrossMoon 15s linear infinite; /* 15 seconds full loop flight path */
        }
        .et-bike {
            font-size: 3.2rem; position: relative; display: inline-block;
            filter: drop-shadow(2px 4px 6px rgba(74, 62, 86, 0.25));
            animation: flightWobble 0.6s linear infinite alternate; /* Pedaling animation */
        }
        .et-shadow {
            width: 45px; height: 6px; background: rgba(74, 62, 86, 0.12); border-radius: 50%;
            margin: -2px auto 0 auto; filter: blur(2px); animation: shadowSizeChange 0.6s linear infinite alternate;
        }

        @keyframes etFlyAcrossMoon {
            0% { top: 45%; left: -120px; transform: scale(0.65) rotate(8deg); opacity: 0; }
            8% { opacity: 1; }
            30% { top: 18%; left: calc(100vw - 220px); transform: scale(0.95) rotate(-3deg); } /* OVERLAPS MOON */
            85% { opacity: 1; }
            100% { top: 5%; left: calc(100vw + 120px); transform: scale(1.1) rotate(-8deg); opacity: 0; }
        }
        @keyframes flightWobble { 0% { transform: translateY(0) rotate(5deg); } 100% { transform: translateY(-3px) rotate(-2deg); } }
        @keyframes shadowSizeChange { 0% { transform: scale(1); opacity: 0.15; } 100% { transform: scale(0.75); opacity: 0.06; } }
        
        /* COZY GLASSMORPHIC LOGIN BOX INTERFACE */
        .box { 
            background: rgba(255, 255, 255, 0.75); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            padding: 40px 30px; border-radius: 35px; border: 3px solid rgba(255, 255, 255, 0.6); 
            width: 310px; text-align: center; box-shadow: 0 15px 35px rgba(167, 139, 250, 0.15); z-index: 3;
        }
        h1 { font-family: 'Fredoka', cursive; color: #F472B6; font-size: 2.8rem; margin: 0 0 5px 0; text-shadow: 3px 3px 0px #FFF; letter-spacing: -1px; }
        .quote-container { font-size: 0.9rem; font-weight: 700; color: #7C3AED; background: rgba(233, 213, 255, 0.5); padding: 12px 15px; border-radius: 15px; margin-bottom: 25px; border-left: 4px solid #C084FC; font-style: italic; min-height: 60px; display: flex; align-items: center; justify-content: center; line-height: 1.4; }
        input { width: 100%; padding: 14px 18px; margin: 10px 0; border: 2px solid #E9D5FF; border-radius: 18px; box-sizing: border-box; font-size: 0.95rem; font-family: inherit; background: rgba(255, 255, 255, 0.9); transition: all 0.3s ease; color: var(--fairy-dark); }
        input:focus { outline: none; border-color: #F472B6; background: #FFF; box-shadow: 0 0 12px rgba(244, 114, 182, 0.25); }
        button { width: 100%; padding: 14px; background: linear-gradient(135deg, #F472B6, #C084FC); color: white; border: none; border-radius: 18px; font-family: 'Fredoka', cursive; font-size: 1.15rem; cursor: pointer; margin-top: 12px; box-shadow: 0 5px 15px rgba(244, 114, 182, 0.3); transition: all 0.2s ease; }
        button:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(244, 114, 182, 0.45); }
        .footer-text { margin-top: 25px; font-size: 0.9rem; font-weight: 700; color: #6B7280; }
        a { color: #C084FC; text-decoration: none; border-bottom: 2px dashed rgba(192, 132, 252, 0.5); padding-bottom: 1px; }
        a:hover { color: #F472B6; border-bottom-color: #F472B6; }
    </style>
</head>
<body>

    <!-- LAYER 1: CHAND BACKDROP -->
    <div class="cinema-moon"></div>

    <!-- LAYER 2: FLYING E.T. BIKE (Bicycle + Basket + Pet Alien combo) -->
    <div class="et-flight-system">
        <div class="et-bike">🚴‍♂️🏽🛸</div>
        <div class="et-shadow"></div>
    </div>

    <!-- LAYER 3: FOREGROUND LOGIN INTERFACE BOX -->
    <div class="box">
        <h1>LikeMe ✨</h1>
        
        <!-- Live Shayari Text Slot -->
        <div class="quote-container" id="quote-box">Loading magic...</div>
        
        <form action="/login" method="POST">
            <input type="text" name="username" placeholder="Fairy Username" required autocomplete="off">
            <input type="password" name="password" placeholder="Secret Password" required>
            <button type="submit">ENTER THE REALM 🌸</button>
        </form>
        <p class="footer-text">New around here? <a href="/register">Create Profile</a></p>
    </div>
    <script>
        const fairyShayaris = [
            "“Library me padhte padhte dil kho gaya... Assignments chhodo, mujhe tumse pyaar ho gaya!” 📝💖",
            "“Canteen ki chai aur tumhaari baatein... Kaatni hain mujhe ab saari raatein!” 🍹✨",
            "“Attendance ki fikar ab hum nahi karte... Jab se aap hamare dil me hain rehte.” 🎒🌸",
            "“Exam me fail hone ka darr nahi ab... Jab se LikeMe pe tum mil gayi ho tab.” 🔮⚡",
            "“Proxy lagane waale toh bohot milenge... Par dil lagane waala sirf LikeMe pe milenge!” 🧸🎀",
            "“Mid-sem ka syllabus aur tumhaari smile... Dono hi samajh ke baahar hain!” 🌀🌙",
            "“Nazar mili tumse toh dil chal pada... Placements chhodo, match hamara bada!” 🪄✨",
            "“Viva me HOD ne pucha 'What is love?'... Maine muskura kar aapka username bata diya.” 🤫🔥",
            "“Chura ke dil mera coding meri bhool gaya... Error solve karte karte tera chehra yaad aa gaya.” 💻💘",
            "“Chai garam, samosa khasta... Tumhaari smile ke aage sab kuch sasta!” ☕🥐",
            "“Group project me kaam toh kuch nahi kiya... Par tumhein dekh kar dil zaroor laga liya.” 📊🌸",
            "“Class me dhyan kam aur LikeMe pe zyaada hai... Tumhe apni batchmate banane ka pakka irada hai.” 😉💎",
            "“Assignment ka pressure aur internal ka darr... Par tumhaari ek chat sab kar deti hai thik-thak.” 📞✨",
            "“8 AM ki class bhi hum attend karenge... Agar tum samne waali seat par baithne ka vaada karo.” ⏰🏫",
            "“Syllabus khatam nahi hua aur semester khatam hone ko hai... Par dil ka har panna tumhaare naam ho chuka hai.” 📖💗",
            "“Are you an internal exam? Because you make my heart beat like crazy.” 📈📈",
            "“Professors look for mistakes in my copy, but I only look for you on campus.” 🔍✨",
            "“Tumhaare smile ke samne college ki saari toppers fail hain, bro!” 🔥🧸",
            "“Hostel ka khana is bad, but looking at your match request makes everything fine.” 🍲❤️",
            "“Is your name WiFi? Because I am feeling a strong connection here.” 📶⚡"
        ];

        // Randomly pick one single index and load it onto screen layout text elements
        const max = fairyShayaris.length;
        document.getElementById('quote-box').innerText = fairyShayaris[Math.floor(Math.random() * max)];
    </script>
</body>
</html>
