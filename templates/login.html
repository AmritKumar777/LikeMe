<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LikeMe ✨ Join the Magic</title>
    
    <!-- PWA Settings -->
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#E9D5FF">
    
    <!-- Google Fonts Pipeline -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Fredoka:wght@600;700&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --pastel-pink: #FFD6E8;
            --pastel-purple: #E8D7FF;
            --pastel-blue: #D6EFFF;
            --fairy-dark: #4A3E56;
        }

        /* DYNAMIC FLUID BACKGROUND SKY */
        body { 
            font-family: 'Quicksand', sans-serif; 
            background: linear-gradient(135deg, var(--pastel-pink), var(--pastel-purple), var(--pastel-blue), #FFE4E6); 
            background-size: 400% 400%;
            animation: fluidGradient 12s ease infinite;
            height: 100vh; display: flex; justify-content: center; align-items: center; margin: 0; overflow: hidden; position: relative;
        }
        @keyframes fluidGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* 🌕 THE BRIGHT GOLDENISH-YELLOW MOON WITH HEAVY NEON GLOW */
        .cinema-moon {
            position: absolute; 
            top: 8%; 
            right: 8%; 
            width: 130px; 
            height: 130px;
            background: radial-gradient(circle, #FFFDF0 20%, #FDE047 80%, #EAB308 100%); /* Golden yellow layers */
            border-radius: 50%;
            /* Intense golden and yellow aura glow */
            filter: drop-shadow(0 0 35px rgba(234, 179, 8, 0.85)) drop-shadow(0 0 65px rgba(253, 224, 71, 0.5));
            z-index: 1; 
            animation: moonPulse 4s ease-in-out infinite alternate;
        }
        @keyframes moonPulse {
            0% { transform: scale(1); filter: drop-shadow(0 0 35px rgba(234, 179, 8, 0.85)); }
            100% { transform: scale(1.04); filter: drop-shadow(0 0 55px rgba(253, 224, 71, 0.95)); }
        }
        /* ☄️ SPICY FLAME HEART METEOR RAIN FROM ABOVE */
        .heart-meteor {
            position: absolute;
            font-size: 2.2rem;
            top: -60px;
            pointer-events: none;
            z-index: 2;
            animation: meteorFall 6s linear infinite;
            filter: drop-shadow(0 0 12px #EF4444);
        }
        /* Flame trail effect behind the heart meteor */
        .heart-meteor::after {
            content: '🔥';
            position: absolute;
            font-size: 1.3rem;
            top: -22px;
            left: 5px;
            transform: rotate(180deg); /* Flips flame upwards */
            opacity: 0.8;
        }

        @keyframes meteorFall {
            0% { transform: translateY(0) translateX(0) rotate(15deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(calc(100vh + 80px)) translateX(-200px) rotate(25deg); opacity: 0; }
        }

        /* 🎈 POPPING FLOATING HEARTS FROM BOTTOM RIGHT */
        .popping-heart {
            position: absolute;
            bottom: -50px;
            right: 5%;
            font-size: 1.8rem;
            pointer-events: none;
            z-index: 2;
            opacity: 0;
            animation: floatUpward 7s ease-in-out infinite;
            filter: drop-shadow(0 0 8px #F472B6);
        }

        @keyframes floatUpward {
            0% { transform: translateY(0) translateX(0) scale(0.5); opacity: 0; }
            15% { opacity: 0.8; }
            50% { transform: translateY(-40vh) translateX(-60px) scale(1.1); }
            85% { opacity: 0.6; }
            100% { transform: translateY(-90vh) translateX(-120px) scale(0.8); opacity: 0; }
        }

        /* Dynamic multi-heart delays assignment */
        .h1 { left: 15%; animation-delay: 0s; animation-duration: 5.5s; }
        .h2 { left: 45%; animation-delay: 2s; animation-duration: 7s; }
        .h3 { left: 70%; animation-delay: 4.5s; animation-duration: 6s; }
        .p1 { right: 4%; animation-delay: 1s; }
        .p2 { right: 12%; animation-delay: 3.5s; animation-duration: 8s; }
        
        /* COZY GLASSMORPHIC LOGIN BOX INTERFACE */
        .box { 
            background: rgba(255, 255, 255, 0.75); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            padding: 40px 30px; border-radius: 35px; border: 3px solid rgba(255, 255, 255, 0.6); 
            width: 310px; text-align: center; box-shadow: 0 15px 35px rgba(167, 139, 250, 0.15); z-index: 3;
        }
        h1 { font-family: 'Fredoka', cursive; color: #F472B6; font-size: 2.8rem; margin: 0 0 5px 0; text-shadow: 3px 3px 0px #FFF; letter-spacing: -1px; }
        .quote-container { font-size: 0.9rem; font-weight: 700; color: #7C3AED; background: rgba(233, 213, 255, 0.5); padding: 12px 15px; border-radius: 15px; margin-bottom: 25px; border-left: 4px solid #C084FC; font-style: italic; min-height: 60px; display: flex; align-items: center; justify-content: center; line-height: 1.4; }
        input { width: 100%; padding: 14px 18px; margin: 10px 0; border: 2px solid #E9D5FF; border-radius: 18px; box-sizing: border-box; font-size: 0.95rem; font-family: inherit; background: rgba(255, 255, 255, 0.9); transition: all 0.3s ease; color: var(--fairy-dark); }
        input:focus { outline: none; border-color: #F472B6; background: #FFF; box-shadow: 0 0 12px rgba(244, 114, 182, 0.25); }
        button { width: 100%; padding: 14px; background: linear-gradient(135deg, #F472B6, #C084FC); color: white; border: none; border-radius: 18px; font-family: 'Fredoka', cursive; font-size: 1.15rem; cursor: pointer; margin-top: 12px; box-shadow: 0 5px 15px rgba(244, 114, 182, 0.3); transition: all 0.2s ease; }
        button:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(244, 114, 182, 0.45); }
        .footer-text { margin-top: 25px; font-size: 0.9rem; font-weight: 700; color: #6B7280; }
        a { color: #C084FC; text-decoration: none; border-bottom: 2px dashed rgba(192, 132, 252, 0.5); padding-bottom: 1px; }
        a:hover { color: #F472B6; border-bottom-color: #F472B6; }
    </style>
</head>
<body>

    <!-- LAYER 1: BRIGHT REYAL GOLDEN MOON BACKDROP -->
    <div class="cinema-moon"></div>

    <!-- LAYER 2: ☄️ SPICY FLAME HEART METEORS FALLING FROM ABOVE -->
    <div class="heart-meteor h1">❤️</div>
    <div class="heart-meteor h2">💖</div>
    <div class="heart-meteor h3">💝</div>

    <!-- LAYER 3: 🎈 POPPING FLOATING HEARTS FROM BOTTOM RIGHT -->
    <div class="popping-heart p1">💗</div>
    <div class="popping-heart p2">💘</div>

    <!-- LAYER 4: FOREGROUND LOGIN INTERFACE BOX -->
    <div class="box">
        <h1>LikeMe ✨</h1>
        
        <!-- Live Shayari Text Slot -->
        <div class="quote-container" id="quote-box">Loading magic...</div>
        
        <form action="/login" method="POST">
            <input type="text" name="username" placeholder="Fairy Username" required autocomplete="off">
            <input type="password" name="password" placeholder="Secret Password" required>
            <button type="submit">ENTER THE REALM 🌸</button>
        </form>
        <p class="footer-text">New around here? <a href="/register">Create Profile</a></p>
    </div>

        // Random index selection loop handler

    </script>
</body>
</html>
