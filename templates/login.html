<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LikeMe ✨ Join the Magic</title>
    
    <!-- PWA Setup Link -->
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#E9D5FF">
    
    <!-- Google Fonts for chunky retro Y2K text styling -->
    <link href="https://googleapis.com" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Quicksand', sans-serif; 
            /* Dreamy holographic Y2K pastel gradient backdrop */
            background: linear-gradient(135deg, #FFD6E8, #E8D7FF, #D6EFFF); 
            height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            margin:0; 
        }
        
        /* The frosted-glass layout container */
        .box { 
            background: rgba(255,255,255,0.8); 
            backdrop-filter: blur(10px); 
            padding: 40px; 
            border-radius: 30px; 
            border: 3px solid #FFF; 
            width: 300px; 
            text-align: center; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.05); 
        }
        
        /* Chunky bubble text header styling */
        h1 { 
            font-family: 'Fredoka One', cursive; 
            color: #F472B6; 
            font-size: 2.5rem; 
            margin: 0 0 20px 0; 
            text-shadow: 2px 2px #FFF; 
        }
        
        /* Rounded pastel text boxes */
        input { 
            width: 100%; 
            padding: 12px; 
            margin: 10px 0; 
            border: 2px solid #E9D5FF; 
            border-radius: 15px; 
            box-sizing: border-box; 
            font-size: 1rem; 
        }
        
        /* Sparkly entry button */
        button { 
            width: 100%; 
            padding: 12px; 
            background: linear-gradient(to right, #F472B6, #C084FC); 
            color: white; 
            border: none; 
            border-radius: 15px; 
            font-family: 'Fredoka One', cursive; 
            font-size: 1.1rem; 
            cursor: pointer; 
            margin-top: 10px; 
        }
        
        a { 
            color: #C084FC; 
            text-decoration: none; 
            font-weight: bold; 
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>LikeMe ✨</h1>
        <!-- Form triggers the Python backend /login action code -->
        <form action="/login" method="POST">
            <input type="text" name="username" placeholder="Fairy Username" required autocomplete="off">
            <input type="password" name="password" placeholder="Secret Password" required>
            <button type="submit">ENTER THE REALM 🌸</button>
        </form>
        <p style="margin-top:20px; font-size:0.9rem;">New fairy? <a href="/register">Create Profile</a></p>
    </div>
</body>
</html>
